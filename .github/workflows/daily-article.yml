name: Daily article

on:
  schedule:
    - cron: "30 1 * * *"    # 07:00 IST — main daily run
    - cron: "30 5 * * *"    # 11:00 IST — backup try (does nothing if today's article exists)
    - cron: "30 9 * * *"    # 15:00 IST — backup try
    - cron: "30 13 * * *"   # 19:00 IST — backup try
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      force:
        description: "Publish even if today's article already exists"
        type: boolean
        default: false

permissions:
  contents: write
  models: read      # lets the robot use free GitHub Models as a backup AI

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write today's article
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TRENDING: ${{ vars.TRENDING || 'on' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/generate.py ${{ inputs.force && '--force' || '' }}

      - name: Build site (pages, images, sitemap, feed, home page)
        if: always()
        run: python scripts/build.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "techdcoded-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "New article: ${{ steps.gen.outputs.title || 'daily update' }}"
          git push

      - name: Notify search engines (IndexNow)
        if: steps.gen.outputs.slug != ''
        run: |
          sleep 90   # give Cloudflare time to deploy
          python scripts/indexnow.py "https://techdcoded.com/articles/${{ steps.gen.outputs.slug }}/" "https://techdcoded.com/articles/" "https://techdcoded.com/"

      - name: Share on other platforms
        if: always()
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: |
          python scripts/syndicate.py || echo "sharing had problems — will retry next run"
          git add data/syndicated.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Shared article links [CF-Pages-Skip]"
            git pull --rebase && git push
          fi

      - name: Summary
        if: steps.gen.outputs.slug != ''
        run: echo "### Published → https://techdcoded.com/articles/${{ steps.gen.outputs.slug }}/" >> $GITHUB_STEP_SUMMARY
